<svg viewBox="0 0 760 360" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="760" height="360" rx="10" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>

  <!-- Left: your database -->
  <rect x="24" y="70" width="210" height="220" rx="9" fill="#dbeafe" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="129" y="98" font-size="14" font-weight="700" fill="#1e3a8a" text-anchor="middle">Your PostgreSQL</text>
  <text x="129" y="116" font-size="14" font-weight="700" fill="#1e3a8a" text-anchor="middle">database</text>
  <rect x="46" y="140" width="166" height="54" rx="6" fill="#eff6ff" stroke="#60a5fa" stroke-width="1"/>
  <text x="129" y="162" font-size="12" fill="#1e3a8a" text-anchor="middle">FOREIGN TABLE</text>
  <text x="129" y="180" font-size="12" font-weight="700" fill="#1e3a8a" text-anchor="middle">earthquakes</text>
  <text x="129" y="228" font-size="11.5" fill="#3b82f6" text-anchor="middle">queried like any</text>
  <text x="129" y="244" font-size="11.5" fill="#3b82f6" text-anchor="middle">local table</text>

  <!-- Middle: FDW -->
  <rect x="300" y="105" width="160" height="150" rx="9" fill="#d1fae5" stroke="#059669" stroke-width="1.5"/>
  <text x="380" y="150" font-size="14" font-weight="700" fill="#065f46" text-anchor="middle">Foreign Data</text>
  <text x="380" y="169" font-size="14" font-weight="700" fill="#065f46" text-anchor="middle">Wrapper</text>
  <text x="380" y="196" font-size="12" fill="#047857" text-anchor="middle">ogr_fdw</text>
  <text x="380" y="213" font-size="12" fill="#047857" text-anchor="middle">postgres_fdw</text>

  <!-- Right: external sources -->
  <rect x="526" y="42" width="210" height="276" rx="9" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/>
  <text x="631" y="68" font-size="14" font-weight="700" fill="#92400e" text-anchor="middle">External sources</text>
  <rect x="546" y="84" width="170" height="42" rx="6" fill="#fffbeb" stroke="#f59e0b" stroke-width="1"/>
  <text x="631" y="110" font-size="12" fill="#78350f" text-anchor="middle">USGS GeoJSON API</text>
  <rect x="546" y="134" width="170" height="42" rx="6" fill="#fffbeb" stroke="#f59e0b" stroke-width="1"/>
  <text x="631" y="160" font-size="12" fill="#78350f" text-anchor="middle">NWS WFS alerts</text>
  <rect x="546" y="184" width="170" height="42" rx="6" fill="#fffbeb" stroke="#f59e0b" stroke-width="1"/>
  <text x="631" y="210" font-size="12" fill="#78350f" text-anchor="middle">ArcGIS REST service</text>
  <rect x="546" y="234" width="170" height="42" rx="6" fill="#fffbeb" stroke="#f59e0b" stroke-width="1"/>
  <text x="631" y="260" font-size="12" fill="#78350f" text-anchor="middle">Remote PostgreSQL</text>

  <!-- Arrows -->
  <defs>
    <marker id="arrowR" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#64748b"/></marker>
    <marker id="arrowL" markerWidth="9" markerHeight="9" refX="2" refY="4.5" orient="auto"><path d="M9,0 L0,4.5 L9,9 z" fill="#64748b"/></marker>
  </defs>

  <line x1="238" y1="156" x2="296" y2="156" stroke="#64748b" stroke-width="1.6" marker-end="url(#arrowR)"/>
  <text x="267" y="146" font-size="10.5" fill="#475569" text-anchor="middle">query</text>
  <line x1="462" y1="204" x2="522" y2="204" stroke="#64748b" stroke-width="1.6" marker-end="url(#arrowR)"/>
  <text x="492" y="194" font-size="10.5" fill="#475569" text-anchor="middle">fetch</text>
  <line x1="522" y1="230" x2="462" y2="230" stroke="#64748b" stroke-width="1.6" marker-end="url(#arrowL)"/>
  <text x="492" y="248" font-size="10.5" fill="#475569" text-anchor="middle">rows</text>
  <line x1="296" y1="182" x2="238" y2="182" stroke="#64748b" stroke-width="1.6" marker-end="url(#arrowL)"/>
  <text x="267" y="200" font-size="10.5" fill="#475569" text-anchor="middle">rows</text>
</svg>
