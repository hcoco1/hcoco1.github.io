<svg viewBox="0 0 760 300" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="760" height="300" rx="10" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>

  <defs>
    <marker id="wf" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#6366f1"/></marker>
  </defs>

  <!-- Row 1 -->
  <g>
    <rect x="28" y="48" width="150" height="58" rx="9" fill="#eef2ff" stroke="#6366f1" stroke-width="1.4"/>
    <text x="103" y="74" font-size="13" font-weight="700" fill="#312e81" text-anchor="middle">Install</text>
    <text x="103" y="92" font-size="12" fill="#4338ca" text-anchor="middle">PostgreSQL</text>

    <rect x="212" y="48" width="150" height="58" rx="9" fill="#e0e7ff" stroke="#6366f1" stroke-width="1.4"/>
    <text x="287" y="74" font-size="13" font-weight="700" fill="#312e81" text-anchor="middle">Enable</text>
    <text x="287" y="92" font-size="12" fill="#4338ca" text-anchor="middle">PostGIS</text>

    <rect x="396" y="48" width="150" height="58" rx="9" fill="#dbeafe" stroke="#3b82f6" stroke-width="1.4"/>
    <text x="471" y="74" font-size="13" font-weight="700" fill="#1e3a8a" text-anchor="middle">Load</text>
    <text x="471" y="92" font-size="12" fill="#1d4ed8" text-anchor="middle">data</text>

    <rect x="580" y="48" width="150" height="58" rx="9" fill="#cffafe" stroke="#0891b2" stroke-width="1.4"/>
    <text x="655" y="74" font-size="13" font-weight="700" fill="#155e75" text-anchor="middle">Explore</text>
    <text x="655" y="92" font-size="12" fill="#0e7490" text-anchor="middle">SELECT</text>
  </g>

  <line x1="178" y1="77" x2="210" y2="77" stroke="#6366f1" stroke-width="1.6" marker-end="url(#wf)"/>
  <line x1="362" y1="77" x2="394" y2="77" stroke="#6366f1" stroke-width="1.6" marker-end="url(#wf)"/>
  <line x1="546" y1="77" x2="578" y2="77" stroke="#6366f1" stroke-width="1.6" marker-end="url(#wf)"/>

  <!-- wrap down -->
  <path d="M655 106 L655 140 L103 140 L103 190" fill="none" stroke="#6366f1" stroke-width="1.6" marker-end="url(#wf)"/>

  <!-- Row 2 -->
  <g>
    <rect x="28" y="192" width="150" height="58" rx="9" fill="#d1fae5" stroke="#059669" stroke-width="1.4"/>
    <text x="103" y="218" font-size="13" font-weight="700" fill="#065f46" text-anchor="middle">Create</text>
    <text x="103" y="236" font-size="12" fill="#047857" text-anchor="middle">tables / views</text>

    <rect x="212" y="192" width="150" height="58" rx="9" fill="#a7f3d0" stroke="#059669" stroke-width="1.4"/>
    <text x="287" y="218" font-size="13" font-weight="700" fill="#065f46" text-anchor="middle">Analyze</text>
    <text x="287" y="236" font-size="12" fill="#047857" text-anchor="middle">spatial joins</text>

    <rect x="396" y="192" width="150" height="58" rx="9" fill="#fde68a" stroke="#d97706" stroke-width="1.4"/>
    <text x="471" y="218" font-size="13" font-weight="700" fill="#92400e" text-anchor="middle">Optimize</text>
    <text x="471" y="236" font-size="12" fill="#b45309" text-anchor="middle">indexes</text>

    <rect x="580" y="192" width="150" height="58" rx="9" fill="#fecaca" stroke="#dc2626" stroke-width="1.4"/>
    <text x="655" y="218" font-size="13" font-weight="700" fill="#991b1b" text-anchor="middle">Publish</text>
    <text x="655" y="236" font-size="12" fill="#b91c1c" text-anchor="middle">to GIS</text>
  </g>

  <line x1="178" y1="221" x2="210" y2="221" stroke="#6366f1" stroke-width="1.6" marker-end="url(#wf)"/>
  <line x1="362" y1="221" x2="394" y2="221" stroke="#6366f1" stroke-width="1.6" marker-end="url(#wf)"/>
  <line x1="546" y1="221" x2="578" y2="221" stroke="#6366f1" stroke-width="1.6" marker-end="url(#wf)"/>
</svg>
