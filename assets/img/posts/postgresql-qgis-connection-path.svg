<svg xmlns="http://www.w3.org/2000/svg" width="1160" height="220" viewBox="0 0 1160 220" role="img" aria-labelledby="title desc">
  <title id="title">PostgreSQL and QGIS connection path</title>
  <desc id="desc">QGIS on Windows connects over localhost port 5432, forwarded by WSL2 NAT networking to PostgreSQL 18 listening on all interfaces, authenticated by pg_hba.conf using scram-sha-256, into the PostGIS-enabled gis database.</desc>
  <style>
    text { font-family: "Segoe UI", system-ui, -apple-system, Roboto, Helvetica, Arial, sans-serif; }
    .title { font-weight: 700; font-size: 15px; }
    .sub { font-size: 12px; fill: #475569; }
    .edge { font-size: 11px; fill: #94a3b8; }
  </style>

  <defs>
    <marker id="arrow" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" refX="10" refY="4" orient="auto">
      <path d="M0,0 L10,4 L0,8 Z" fill="#94a3b8"/>
    </marker>
  </defs>

  <!-- connectors -->
  <line x1="210" y1="135" x2="250" y2="135" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="440" y1="135" x2="480" y2="135" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="670" y1="135" x2="710" y2="135" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="900" y1="135" x2="958" y2="135" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- edge label -->
  <text class="edge" x="230" y="78" text-anchor="middle">host=localhost:5432</text>

  <!-- Box 1: QGIS -->
  <rect x="20" y="90" width="190" height="90" rx="10" fill="#ecfdf5" stroke="#16a34a" stroke-width="2"/>
  <text class="title" x="115" y="129" text-anchor="middle" fill="#15803d">QGIS 3.44</text>
  <text class="sub" x="115" y="151" text-anchor="middle">Windows client</text>

  <!-- Box 2: WSL2 NAT -->
  <rect x="250" y="90" width="190" height="90" rx="10" fill="#fffbeb" stroke="#d97706" stroke-width="2"/>
  <text class="title" x="345" y="129" text-anchor="middle" fill="#b45309">WSL2 &#183; NAT</text>
  <text class="sub" x="345" y="151" text-anchor="middle">localhost forward</text>

  <!-- Box 3: PostgreSQL -->
  <rect x="480" y="90" width="190" height="90" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <text class="title" x="575" y="129" text-anchor="middle" fill="#1d4ed8">PostgreSQL 18</text>
  <text class="sub" x="575" y="151" text-anchor="middle">all interfaces</text>

  <!-- Box 4: pg_hba -->
  <rect x="710" y="90" width="190" height="90" rx="10" fill="#f5f3ff" stroke="#7c3aed" stroke-width="2"/>
  <text class="title" x="805" y="129" text-anchor="middle" fill="#6d28d9">pg_hba.conf</text>
  <text class="sub" x="805" y="151" text-anchor="middle">scram-sha-256</text>

  <!-- Box 5: database (cylinder) -->
  <path d="M960 103 L960 167 A75 13 0 0 0 1110 167 L1110 103" fill="#ecfeff" stroke="#0891b2" stroke-width="2"/>
  <ellipse cx="1035" cy="103" rx="75" ry="13" fill="#ecfeff" stroke="#0891b2" stroke-width="2"/>
  <text class="title" x="1035" y="132" text-anchor="middle" fill="#0e7490">gis database</text>
  <text class="sub" x="1035" y="153" text-anchor="middle">PostGIS enabled</text>
</svg>
